<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="訊號看板">
<meta name="theme-color" content="#1a1510">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231a1510'/%3E%3Ccircle cx='90' cy='90' r='60' fill='none' stroke='%23c9a96e' stroke-width='5'/%3E%3Cpolyline points='50,115 72,80 95,98 128,58' fill='none' stroke='%23c9a96e' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='128' cy='58' r='7' fill='%23a8c97a'/%3E%3C/svg%3E">
<title>籌碼訊號看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1510;
  --bg2: #211c15;
  --surface: #2a2318;
  --surface2: #332b1e;
  --border: #3d3226;
  --gold: #c9a96e;
  --gold-dim: #8a6e42;
  --green: #a8c97a;
  --red: #d4756a;
  --yellow: #d4b86a;
  --blue: #7aafc9;
  --text: #e8dcc8;
  --muted: #7a6a52;
  --muted2: #2e2619;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}

/* Subtle texture */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(201,169,110,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(168,201,122,0.03) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

.wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; position: relative; z-index: 1; }

/* Header */
header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.8rem; flex-wrap: wrap; gap: 10px;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
}
.logo-text {}
.logo-title { font-family: 'DM Mono', monospace; font-size: 1.1rem; letter-spacing: 0.08em; color: var(--gold); }
.logo-sub { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.05em; margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.date-tag {
  font-family: 'DM Mono', monospace; font-size: 0.68rem;
  color: var(--muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 0.28rem 0.65rem;
}
.refresh-btn {
  background: var(--gold); color: var(--bg); border: none;
  border-radius: 7px; padding: 0.4rem 0.9rem;
  font-family: 'DM Mono', monospace; font-size: 0.73rem;
  font-weight: 700; cursor: pointer; transition: opacity 0.2s;
  letter-spacing: 0.03em;
}
.refresh-btn:hover { opacity: 0.8; }

/* Summary */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.4rem; }
.sum-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.85rem 1rem;
}
.sum-label { font-size: 0.64rem; color: var(--muted); letter-spacing: 0.06em; font-family: 'DM Mono', monospace; margin-bottom: 5px; }
.sum-val { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 500; }
.sum-val.green { color: var(--green); }
.sum-val.yellow { color: var(--yellow); }
.sum-val.red { color: var(--red); }
.sum-val.gold { color: var(--gold); }

/* Filters */
.filters { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.filter-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.3rem 0.8rem;
  font-size: 0.72rem; color: var(--muted); cursor: pointer;
  transition: all 0.18s; font-family: 'DM Mono', monospace;
  letter-spacing: 0.03em;
}
.filter-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
.filter-btn.active { background: rgba(201,169,110,0.1); border-color: var(--gold); color: var(--gold); }

/* Search */
.search-row { margin-bottom: 1.2rem; }
.search-input {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.55rem 1rem;
  color: var(--text); font-family: 'DM Mono', monospace;
  font-size: 0.82rem; outline: none;
  width: 100%; max-width: 280px;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--gold-dim); }
.search-input::placeholder { color: var(--muted); }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.1rem 1.2rem;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.2s;
  animation: fadeUp 0.35s ease both;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.4); }
.card.op-buy { border-color: rgba(168,201,122,0.35); background: linear-gradient(135deg, var(--surface) 0%, rgba(168,201,122,0.04) 100%); }
.card.op-watch { border-color: rgba(212,184,106,0.3); background: linear-gradient(135deg, var(--surface) 0%, rgba(212,184,106,0.03) 100%); }
.card.op-avoid { border-color: rgba(212,117,106,0.3); }
.card.op-bear { border-color: rgba(100,90,80,0.3); }

@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* Card top */
.card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.stock-name { font-weight: 700; font-size: 1.05rem; color: var(--text); }
.stock-code { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
.price { font-family: 'DM Mono', monospace; font-size: 1.15rem; font-weight: 500; color: var(--gold); }

/* Score */
.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.score-bar-bg { flex: 1; height: 4px; background: var(--muted2); border-radius: 2px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.score-num { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

/* Op badge */
.op-badge {
  display: inline-block; font-size: 0.71rem;
  font-family: 'DM Mono', monospace; padding: 0.2rem 0.6rem;
  border-radius: 5px; margin-bottom: 10px; font-weight: 500;
  letter-spacing: 0.02em;
}
.op-badge.buy { background: rgba(168,201,122,0.12); color: var(--green); border: 1px solid rgba(168,201,122,0.25); }
.op-badge.watch { background: rgba(212,184,106,0.1); color: var(--yellow); border: 1px solid rgba(212,184,106,0.22); }
.op-badge.avoid { background: rgba(212,117,106,0.1); color: var(--red); border: 1px solid rgba(212,117,106,0.2); }
.op-badge.bear { background: rgba(100,90,80,0.15); color: #9a8a76; border: 1px solid rgba(100,90,80,0.25); }
.op-badge.neutral { background: var(--muted2); color: var(--muted); border: 1px solid var(--border); }

/* Mini stats */
.mini-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
.mini-stat { background: var(--muted2); border-radius: 7px; padding: 0.38rem 0.5rem; }
.mini-label { font-size: 0.58rem; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 2px; }
.mini-val { font-size: 0.79rem; font-family: 'DM Mono', monospace; }
.mini-val.pos { color: var(--red); }
.mini-val.neg { color: var(--blue); }
.mini-val.neu { color: var(--text); }

/* Score breakdown */
.score-breakdown { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.score-pip {
  font-size: 0.62rem; font-family: 'DM Mono', monospace;
  padding: 0.12rem 0.4rem; border-radius: 3px;
  background: var(--muted2); color: var(--muted);
  border: 1px solid var(--border);
}
.score-pip.on { background: rgba(201,169,110,0.12); color: var(--gold); border-color: rgba(201,169,110,0.25); }

/* Reasons */
.reasons { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-wrap: wrap; gap: 3px; }
.rtag {
  font-size: 0.65rem; font-family: 'DM Mono', monospace;
  padding: 0.1rem 0.38rem; border-radius: 3px;
  background: var(--muted2); color: var(--muted);
}
.rtag.good { background: rgba(168,201,122,0.09); color: var(--green); }
.rtag.warn { background: rgba(212,117,106,0.09); color: var(--red); }
.rtag.info { background: rgba(201,169,110,0.08); color: var(--gold-dim); }

/* States */
.state { text-align: center; padding: 5rem 1rem; color: var(--muted); }
.spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--gold);
  animation: spin 0.7s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: rgba(212,117,106,0.08); border: 1px solid rgba(212,117,106,0.2);
  border-radius: 10px; padding: 1rem 1.2rem; color: var(--red);
  font-size: 0.82rem; margin-bottom: 1rem; line-height: 1.6;
}

/* PWA hint */
#pwa-hint {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); border: 1px solid var(--gold-dim);
  border-radius: 14px; padding: 0.9rem 1.2rem;
  font-size: 0.76rem; color: var(--text);
  max-width: 320px; width: 90%;
  z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: flex; align-items: center; gap: 10px;
  animation: fadeUp 0.4s ease;
}

@media (max-width: 600px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">📈</div>
      <div class="logo-text">
        <div class="logo-title">籌碼訊號看板</div>
        <div class="logo-sub">INSTITUTIONAL SIGNAL TRACKER</div>
      </div>
    </div>
    <div class="header-right">
      <span class="date-tag" id="dateTag">— 載入中</span>
      <button class="refresh-btn" onclick="loadData()">↻ 重新載入</button>
    </div>
  </header>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">🟢 買入參考</div>
      <div class="sum-val green" id="cntBuy">—</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">🟡 觀察中</div>
      <div class="sum-val yellow" id="cntWatch">—</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">🔴 避開</div>
      <div class="sum-val red" id="cntAvoid">—</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">✦ 總分最高</div>
      <div class="sum-val gold" id="topScore">—</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" onclick="setFilter('buy',this)">🟢 買入</button>
    <button class="filter-btn" onclick="setFilter('watch',this)">🟡 觀察</button>
    <button class="filter-btn" onclick="setFilter('avoid',this)">🔴 避開</button>
    <button class="filter-btn" onclick="setFilter('bear',this)">⬇️ 空頭</button>
  </div>

  <div class="search-row">
    <input class="search-input" id="searchInput" placeholder="搜尋名稱或代號..." oninput="renderCards()">
  </div>

  <div id="errorBox" class="error-box" style="display:none"></div>
  <div id="content"><div class="state"><div class="spinner"></div><div style="font-size:0.82rem">載入資料中...</div></div></div>
</div>

<script>
const SHEET_ID = '17JrdvcOghYVQpMNjJdd7Jkwu0RxNhkC5eqtIF7NAuIg';
const SHEET_NAME = '訊號看板';
let allStocks = [];
let currentFilter = 'all';

const COL = {
  date:0,code:1,name:2,price:3,score:4,
  volS:5,momS:6,instS:7,concS:8,rsiS:9,kdS:10,
  instNet:11,streak:12,conc5:13,stockPct:14,
  rsi:15,kVal:16,dVal:17,abnormal:18,op:19,reasons:20
};

function getOpClass(op) {
  if (!op) return 'neutral';
  if (op.includes('🟢')) return 'buy';
  if (op.includes('🟡')) return 'watch';
  if (op.includes('⬇️')) return 'bear';
  if (op.includes('🔴')) return 'avoid';
  return 'neutral';
}

function getBarColor(score, max) {
  const p = score/max;
  if (p>=0.75) return '#a8c97a';
  if (p>=0.5)  return '#d4b86a';
  if (p>=0.25) return '#c9a96e';
  return '#4a3d2a';
}

function parseReasons(str) {
  return (str||'').split('|').map(s=>s.trim()).filter(Boolean);
}

function rClass(r) {
  if (/站上|買超|甜蜜|連買|放大|多頭|新高|外資連/.test(r)) return 'good';
  if (/賣|縮量|空頭|過熱|超買/.test(r)) return 'warn';
  return 'info';
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="state"><div class="spinner"></div><div style="font-size:0.82rem">載入資料中...</div></div>';
  document.getElementById('errorBox').style.display = 'none';

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^.*?\(/, '').replace(/\);?\s*$/, ''));
    const rows = json.table.rows;
    if (!rows || rows.length < 2) { showError('Google Sheet 沒有資料，請先執行 Apps Script！'); return; }

    allStocks = rows.slice(1).map(row => {
      const c = row.c;
      const g = (i, fallback='') => c[i] ? (c[i].v !== null && c[i].v !== undefined ? c[i].v : (c[i].f || fallback)) : fallback;
      return {
        date: String(g(COL.date,'')),
        code: String(g(COL.code,'')),
        name: String(g(COL.name,'')),
        price: g(COL.price,0),
        score: Number(g(COL.score,0)),
        volS: Number(g(COL.volS,0)),
        momS: Number(g(COL.momS,0)),
        instS: Number(g(COL.instS,0)),
        concS: Number(g(COL.concS,0)),
        rsiS: Number(g(COL.rsiS,0)),
        kdS: Number(g(COL.kdS,0)),
        instNet: Number(g(COL.instNet,0)),
        streak: Number(g(COL.streak,0)),
        conc5: String(g(COL.conc5,'')),
        rsi: String(g(COL.rsi,'')),
        kVal: String(g(COL.kVal,'')),
        dVal: String(g(COL.dVal,'')),
        abnormal: String(g(COL.abnormal,'')),
        op: String(g(COL.op,'')),
        reasons: String(g(COL.reasons,'')),
      };
    }).filter(s => s.code);

    const cntBuy   = allStocks.filter(s=>s.op.includes('🟢')).length;
    const cntWatch = allStocks.filter(s=>s.op.includes('🟡')).length;
    const cntAvoid = allStocks.filter(s=>s.op.includes('🔴')||s.op.includes('⬇️')).length;
    const top = allStocks.length ? Math.max(...allStocks.map(s=>s.score)) : 0;

    document.getElementById('cntBuy').textContent   = cntBuy;
    document.getElementById('cntWatch').textContent = cntWatch;
    document.getElementById('cntAvoid').textContent = cntAvoid;
    document.getElementById('topScore').textContent = top + ' 分';
    document.getElementById('dateTag').textContent  = allStocks[0]?.date || '—';

    renderCards();
  } catch(e) {
    showError('載入失敗：' + e.message + '（請確認 Google Sheet 已設為公開）');
  }
}

function showError(msg) {
  document.getElementById('errorBox').textContent = '⚠ ' + msg;
  document.getElementById('errorBox').style.display = 'block';
  document.getElementById('content').innerHTML = '';
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function renderCards() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const MAX = 12;

  let list = allStocks.filter(s => {
    if (q && !s.name.toLowerCase().includes(q) && !s.code.includes(q)) return false;
    if (currentFilter==='buy')   return s.op.includes('🟢');
    if (currentFilter==='watch') return s.op.includes('🟡');
    if (currentFilter==='avoid') return s.op.includes('🔴');
    if (currentFilter==='bear')  return s.op.includes('⬇️');
    return true;
  });

  if (!list.length) {
    document.getElementById('content').innerHTML = '<div class="state"><div style="font-size:2rem;margin-bottom:10px">🌾</div><div>沒有符合條件的股票</div></div>';
    return;
  }

  const scoreLabels = ['量能','動能','法人','集中','RSI','KD'];
  const scoreVals   = ['volS','momS','instS','concS','rsiS','kdS'];
  const scoreMax    = [2,3,3,2,1,1];

  const html = list.map((s,i) => {
    const opClass = getOpClass(s.op);
    const barPct  = Math.min(s.score/MAX*100,100);
    const barColor = getBarColor(s.score, MAX);
    const pos = s.instNet > 0;
    const reasons = parseReasons(s.reasons);

    const pips = scoreLabels.map((lbl,j) => {
      const val = s[scoreVals[j]];
      const on  = val > 0;
      return `<span class="score-pip ${on?'on':''}">${lbl}${val}</span>`;
    }).join('');

    return `<div class="card op-${opClass}" style="animation-delay:${Math.min(i*0.035,0.5)}s">
      <div class="card-top">
        <div>
          <div class="stock-name">${s.name}</div>
          <div class="stock-code">${s.code}</div>
        </div>
        <div class="price">${s.price}</div>
      </div>

      <div class="score-row">
        <div class="score-bar-bg">
          <div class="score-bar-fill" style="width:${barPct}%;background:${barColor}"></div>
        </div>
        <div class="score-num">${s.score}/${MAX}</div>
      </div>

      <div class="op-badge ${opClass}">${s.op||'－'}</div>

      <div class="mini-stats">
        <div class="mini-stat">
          <div class="mini-label">法人(張)</div>
          <div class="mini-val ${pos?'pos':'neg'}">${pos?'+':''}${s.instNet}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">連買天</div>
          <div class="mini-val neu">${s.streak}天</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">五日集中</div>
          <div class="mini-val neu">${s.conc5}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">RSI</div>
          <div class="mini-val neu">${s.rsi}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">K / D</div>
          <div class="mini-val neu">${s.kVal}/${s.dVal}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">異常倍數</div>
          <div class="mini-val neu">${s.abnormal}</div>
        </div>
      </div>

      <div class="score-breakdown">${pips}</div>

      <div class="reasons">
        ${reasons.map(r=>`<span class="rtag ${rClass(r)}">${r}</span>`).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="cards">${html}</div>`;
}

loadData();

// PWA hint
if (!window.navigator.standalone && !localStorage.getItem('pwa-dismissed')) {
  setTimeout(() => {
    const el = document.createElement('div');
    el.id = 'pwa-hint';
    el.innerHTML = `<div style="flex:1">📲 Safari <strong style="color:#c9a96e">分享 □↑</strong> → <strong style="color:#c9a96e">加入主畫面</strong>，像 App 使用</div><button onclick="this.parentElement.remove();localStorage.setItem('pwa-dismissed','1')" style="background:transparent;border:none;color:#7a6a52;font-size:1.1rem;cursor:pointer">✕</button>`;
    document.body.appendChild(el);
  }, 2000);
}
</script>
</body>
</html>
