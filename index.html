<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="訊號看板">
<meta name="theme-color" content="#f5f0e8">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<title>籌碼訊號看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --bg2: #ede7da;
  --card: #ffffff;
  --card2: #faf7f2;
  --border: #e0d8cc;
  --brown: #a07850;
  --brown-light: #c8a878;
  --brown-dark: #7a5830;
  --green: #5a9460;
  --red: #c05848;
  --yellow: #c08830;
  --blue: #4878a0;
  --text: #3a2e20;
  --text2: #7a6a52;
  --text3: #b0a090;
  --shadow: rgba(120,90,60,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', -apple-system, sans-serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,80px);
}
.wrap { max-width: 640px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }

header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.2rem; padding: 1rem 1.2rem;
  background: var(--card); border-radius: 18px;
  box-shadow: 0 2px 12px var(--shadow);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--bg2); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.logo-title { font-size: 1rem; font-weight: 700; color: var(--text); }
.logo-sub { font-size: 0.6rem; color: var(--text3); margin-top: 1px; letter-spacing: 0.05em; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.date-tag { font-size: 0.65rem; color: var(--text3); }
.refresh-btn { background: var(--brown); color: #fff; border: none; border-radius: 20px; padding: 0.35rem 1rem; font-size: 0.73rem; font-weight: 500; cursor: pointer; font-family: inherit; }

.summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1.2rem; }
.market-card {
  background: var(--card); border-radius: 18px;
  padding: 1rem 1.2rem; margin-bottom: 1.2rem;
  box-shadow: 0 2px 12px var(--shadow);
}
.market-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
.market-item { background: var(--card2); border-radius: 10px; padding: 0.5rem 0.6rem; border: 1px solid var(--border); }
.market-label { font-size: 0.6rem; color: var(--text3); margin-bottom: 3px; }
.market-val { font-size: 0.9rem; font-weight: 700; }
.market-status { margin-top: 8px; font-size: 0.82rem; font-weight: 500; padding: 0.4rem 0.8rem; border-radius: 8px; background: var(--bg2); }
.market-loading { color: var(--text3); font-size: 0.8rem; }
.sum-card { background: var(--card); border-radius: 16px; padding: 1rem 1.1rem; box-shadow: 0 2px 10px var(--shadow); }
.sum-label { font-size: 0.68rem; color: var(--text2); margin-bottom: 4px; }
.sum-val { font-size: 1.6rem; font-weight: 700; }
.sum-val.green { color: var(--green); }
.sum-val.yellow { color: var(--yellow); }
.sum-val.red { color: var(--red); }
.sum-val.brown { color: var(--brown); }
.sum-sub { font-size: 0.6rem; color: var(--text3); margin-top: 2px; }

.filters { display: flex; gap: 6px; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn { background: var(--card); border: 1.5px solid var(--border); border-radius: 20px; padding: 0.3rem 0.85rem; font-size: 0.72rem; color: var(--text2); cursor: pointer; white-space: nowrap; font-family: inherit; box-shadow: 0 1px 4px var(--shadow); transition: all 0.15s; }
.filter-btn.active { background: var(--brown); border-color: var(--brown); color: #fff; }

.search-wrap { position: relative; margin-bottom: 1rem; }
.search-input { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 0.6rem 1rem 0.6rem 2.5rem; color: var(--text); font-size: 0.85rem; outline: none; width: 100%; font-family: inherit; box-shadow: 0 1px 6px var(--shadow); }
.search-input:focus { border-color: var(--brown-light); }
.search-input::placeholder { color: var(--text3); }
.search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: var(--text3); }

.error-box { background: #fff5f5; border: 1.5px solid #f0c0b8; border-radius: 12px; padding: 0.9rem 1rem; color: var(--red); font-size: 0.8rem; margin-bottom: 1rem; line-height: 1.6; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border-radius: 18px; padding: 1.1rem 1.2rem; box-shadow: 0 2px 12px var(--shadow); border-left: 4px solid transparent; animation: fadeUp 0.3s ease both; }
.card.op-buy   { border-left-color: var(--green); }
.card.op-watch { border-left-color: var(--yellow); }
.card.op-avoid { border-left-color: var(--red); }
.card.op-bear  { border-left-color: var(--text3); }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.stock-name { font-size: 1.05rem; font-weight: 700; }
.stock-code { font-size: 0.68rem; color: var(--text3); margin-top: 2px; }
.price { font-size: 1.1rem; font-weight: 700; color: var(--brown-dark); }

.op-badge { display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 500; padding: 0.22rem 0.65rem; border-radius: 20px; margin-bottom: 10px; }
.op-badge.buy   { background: #eaf5ea; color: var(--green); }
.op-badge.watch { background: #fef8ea; color: var(--yellow); }
.op-badge.avoid { background: #fef0ee; color: var(--red); }
.op-badge.bear  { background: var(--bg2); color: var(--text2); }
.op-badge.neutral { background: var(--bg2); color: var(--text2); }

.score-section { margin-bottom: 10px; }
.score-top { display: flex; justify-content: space-between; margin-bottom: 5px; }
.score-text { font-size: 0.68rem; color: var(--text2); }
.score-num { font-size: 0.68rem; font-weight: 700; color: var(--brown); }
.score-bar-bg { height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.stat-box { background: var(--card2); border-radius: 10px; padding: 0.5rem 0.6rem; border: 1px solid var(--border); }
.stat-label { font-size: 0.6rem; color: var(--text3); margin-bottom: 3px; }
.stat-val { font-size: 0.82rem; font-weight: 500; }
.stat-val.pos { color: var(--red); }
.stat-val.neg { color: var(--blue); }
.stat-val.neu { color: var(--text); }

.breakdown { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.pip { font-size: 0.62rem; padding: 0.13rem 0.45rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--text3); }
.pip.on { background: #f5ede0; color: var(--brown); border-color: var(--brown-light); font-weight: 600; }

.reasons { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
.rtag { font-size: 0.62rem; padding: 0.12rem 0.42rem; border-radius: 6px; background: var(--bg2); color: var(--text2); }
.rtag.good { background: #eaf5ea; color: var(--green); }
.rtag.warn { background: #fef0ee; color: var(--red); }
.rtag.info { background: #f5ede0; color: var(--brown); }

.state { text-align: center; padding: 4rem 1rem; color: var(--text3); font-size: 0.85rem; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--brown); animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.top-pick-chip {
  flex-shrink: 0; background: var(--card);
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 0.5rem 0.8rem; cursor: pointer;
  transition: border-color 0.15s; box-shadow: 0 1px 6px var(--shadow);
  min-width: 100px;
}
.top-pick-chip.buy { border-color: rgba(90,148,96,0.4); background: linear-gradient(135deg, #fff 0%, #f0f8f0 100%); }
.top-pick-chip.watch { border-color: rgba(192,136,48,0.35); }
.top-pick-chip-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
.top-pick-chip-code { font-size: 0.62rem; color: var(--text3); margin-top: 1px; }
.top-pick-chip-score { font-size: 0.72rem; font-weight: 600; color: var(--brown); margin-top: 4px; }
.top-pick-chip-op { font-size: 0.65rem; margin-top: 2px; }

.vol-tag {
  display: inline-block; font-size: 0.65rem; padding: 0.1rem 0.4rem;
  border-radius: 5px; margin-right: 4px; font-weight: 500;
}
.vol-whale { background: #e8f4fd; color: #2878c0; }
.vol-fish  { background: #eaf5ea; color: #3a8a40; }
.vol-shrimp{ background: #fef8ea; color: #b07820; }

.sector-filter {
  display: flex; gap: 6px; margin-bottom: 1rem;
  overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
}
.sector-filter::-webkit-scrollbar { display: none; }
.sector-select {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 0.3rem 0.85rem;
  font-size: 0.72rem; color: var(--text2); font-family: inherit;
  box-shadow: 0 1px 4px var(--shadow); cursor: pointer; outline: none;
  appearance: none; -webkit-appearance: none;
}

.sector-card {
  background: var(--card); border-radius: 16px;
  padding: 1rem 1.2rem; margin-bottom: 8px;
  box-shadow: 0 2px 10px var(--shadow);
  border-left: 4px solid transparent;
}
.sector-card.hot { border-left-color: var(--red); }
.sector-card.up { border-left-color: var(--green); }
.sector-card.down { border-left-color: var(--blue); }
.sector-card.neutral { border-left-color: var(--text3); }
.sector-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.sector-name { font-size: 1rem; font-weight: 700; }
.sector-heat { font-size: 0.78rem; font-weight: 500; }
.sector-bar-bg { height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.sector-bar-fill { height: 100%; border-radius: 3px; }
.sector-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }
.sector-stat { background: var(--card2); border-radius: 8px; padding: 0.4rem 0.5rem; border: 1px solid var(--border); }
.sector-stat-label { font-size: 0.58rem; color: var(--text3); margin-bottom: 2px; }
.sector-stat-val { font-size: 0.82rem; font-weight: 500; }

#pwa-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--brown-dark); color: #fff; border-radius: 14px; padding: 0.85rem 1.1rem; font-size: 0.76rem; max-width: 320px; width: 90%; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; animation: fadeUp 0.4s ease; }
</style>
</head>
<body>
<div class="wrap" id="signalPage">
    <div class="logo">
      <div class="logo-icon">📈</div>
      <div>
        <div class="logo-title">籌碼訊號看板</div>
        <div class="logo-sub">INSTITUTIONAL SIGNAL TRACKER</div>
      </div>
    </div>
    <div class="header-right">
      <span class="date-tag" id="dateTag">載入中...</span>
      <button class="refresh-btn" onclick="loadData()">↻ 重新載入</button>
    </div>
  </header>

  <!-- 大盤雷達 -->
  <div id="marketRadar" class="market-card">
    <div class="market-loading">載入大盤資料...</div>
  </div>

  <!-- 日期選單 -->
  <div style="margin-bottom:1rem">
    <select id="dateSelect" onchange="loadData()" style="background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:0.3rem 0.85rem;font-size:0.72rem;color:var(--text2);font-family:inherit;box-shadow:0 1px 4px var(--shadow);cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;width:100%">
      <option value="">📅 載入中...</option>
    </select>
  </div>

  <!-- 每日總結 -->
  <div id="dailySummarySection" style="display:none;margin-bottom:1.2rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:0.82rem;font-weight:700;color:var(--text)">📝 每日總結</div>
      <button id="summaryRefreshBtn" onclick="generateDailySummary()" style="background:transparent;border:none;font-size:0.65rem;color:var(--brown);cursor:pointer;font-family:inherit;padding:0">↻ 重新生成</button>
    </div>
    <div id="dailySummaryCard" style="background:var(--card);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 2px 12px var(--shadow);border-left:4px solid var(--brown-light);font-size:0.82rem;line-height:1.75;color:var(--text2)">
      <div class="spinner" style="width:20px;height:20px;margin:0.5rem auto"></div>
    </div>
  </div>

  <!-- 每日新聞 -->
  <div id="dailyNewsSection" style="margin-bottom:1.2rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:0.82rem;font-weight:700;color:var(--text)">📰 今日科技要聞</div>
      <button onclick="loadNews()" style="background:transparent;border:none;font-size:0.65rem;color:var(--brown);cursor:pointer;font-family:inherit;padding:0">↻ 重新載入</button>
    </div>
    <div id="newsContent" style="background:var(--card);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 2px 12px var(--shadow)">
      <div class="spinner" style="width:20px;height:20px;margin:0.5rem auto"></div>
    </div>
  </div>
    <select class="sector-select" id="sectorFilter" onchange="renderCards()">
      <option value="">🏭 所有板塊</option>
      <option value="半導體/IC設計">半導體/IC設計</option>
      <option value="封測">封測</option>
      <option value="AI伺服器/ODM">AI伺服器/ODM</option>
      <option value="電源/散熱">電源/散熱</option>
      <option value="PCB/載板">PCB/載板</option>
      <option value="網通/連接">網通/連接</option>
      <option value="光電/面板">光電/面板</option>
      <option value="被動元件/機構">被動元件/機構</option>
      <option value="記憶體">記憶體</option>
      <option value="測試設備">測試設備</option>
      <option value="工業電腦/自動化">工業電腦/自動化</option>
      <option value="電子通路">電子通路</option>
      <option value="軟體/雲端">軟體/雲端</option>
      <option value="電動車/綠能">電動車/綠能</option>
      <option value="其他電子">其他電子</option>
    </select>
    <select class="sector-select" id="volFilter" onchange="renderCards()">
      <option value="">📊 所有規模</option>
      <option value="whale">🐋 大型</option>
      <option value="fish">🐟 中型</option>
      <option value="shrimp">🦐 小型</option>
    </select>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" onclick="setFilter('buy',this)">🟢 買入</button>
    
    <button class="filter-btn" onclick="setFilter('avoid',this)">🔴 避開</button>
    <button class="filter-btn" onclick="setFilter('bear',this)">⬇️ 空頭</button>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="搜尋股票名稱或代號..." oninput="renderCards()">
  </div>

  <div id="errorBox" class="error-box" style="display:none"></div>
  <div id="content"><div class="state"><div class="spinner"></div><div>載入資料中...</div></div></div>
</div>



<!-- Bottom Nav -->
<div class="bottom-nav">
    <span>📈</span><span>訊號</span>
  </button>
  <button class="nav-btn" id="navSector" onclick="showPage('sector')">
    <span>🏭</span><span>板塊</span>
  </button>
  <button class="nav-btn" id="navBacktest" onclick="showPage('backtest')">
    <span>📊</span><span>回測</span>
  </button>
  <button class="nav-btn" id="navAI" onclick="showPage('ai')">
    <span>🤖</span><span>AI分析</span>
  </button>
</div>

<!-- Sector Page -->
<div id="sectorPage" style="display:none">
  <div class="wrap">
    <div class="bt-header">
      <div class="logo">
        <div class="logo-icon">🏭</div>
        <div>
          <div class="logo-title">板塊熱度</div>
          <div class="logo-sub">SECTOR HEAT MAP</div>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadSector()">↻ 重新載入</button>
    </div>
    <div id="sectorContent">
      <div class="state"><div class="spinner"></div><div>載入板塊資料...</div></div>
    </div>
  </div>
</div>

<!-- Backtest Page -->
<div id="backtestPage" style="display:none">
  <div class="wrap">
    <div class="bt-header">
      <div class="logo">
        <div class="logo-icon">📊</div>
        <div>
          <div class="logo-title">回測分析</div>
          <div class="logo-sub">BACKTEST ANALYSIS</div>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadBacktest()">↻ 重新載入</button>
    </div>

    <div class="summary" id="btSummary">
      <div class="sum-card">
        <div class="sum-label">總訊號數</div>
        <div class="sum-val brown" id="btTotal">—</div>
        <div class="sum-sub">買入訊號累計</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">1日平均報酬</div>
        <div class="sum-val" id="btWinRate">—</div>
        <div class="sum-sub">隔日平均漲跌幅</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">3日平均報酬</div>
        <div class="sum-val" id="btAvgReturn">—</div>
        <div class="sum-sub">3日平均漲跌幅</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">待確認</div>
        <div class="sum-val yellow" id="btPending">—</div>
        <div class="sum-sub">尚未到期</div>
      </div>
    </div>

    <div id="btContent">
      <div class="state"><div class="spinner"></div><div>載入回測資料...</div></div>
    </div>
  </div>
</div>

<!-- AI Analysis Page -->
<div id="aiPage" style="display:none">
  <div class="wrap">
    <div class="bt-header">
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <div>
          <div class="logo-title">AI 分析</div>
          <div class="logo-sub">AI STOCK ANALYSIS</div>
        </div>
      </div>
      <button class="reload-btn" onclick="loadAI()">↺ 重新載入</button>
    </div>

    <!-- 日期選擇 -->
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:0.8rem;color:var(--text2)">選擇日期：</span>
      <select id="aiDateSelect" onchange="loadAIByDate(this.value)"
        style="font-size:0.8rem;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text)">
        <option value="">載入中...</option>
      </select>
      <span id="aiStockCount" style="font-size:0.75rem;color:var(--text3)"></span>
    </div>

    <!-- AI 對話框 -->
    <div style="margin-bottom:12px">
      <div style="font-size:0.82rem;font-weight:700;color:var(--text);margin-bottom:8px">💬 問 AI</div>
      <div style="font-size:0.7rem;color:var(--text3);margin-bottom:8px">輸入股票代號或問題，例如：「2330」「前鼎要買嗎」「今天適合進場嗎」</div>
      <div style="display:flex;gap:8px">
        <input id="aiChatInput" placeholder="輸入代號或問題..."
          style="flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:12px;
          padding:0.6rem 1rem;color:var(--text);font-size:0.85rem;outline:none;font-family:inherit"
          onkeydown="if(event.key==='Enter')sendAIChat()">
        <button onclick="sendAIChat()"
          style="background:var(--brown);color:white;border:none;border-radius:12px;
          padding:0.6rem 1.2rem;font-size:0.82rem;cursor:pointer;font-family:inherit;white-space:nowrap">
          送出
        </button>
      </div>
      <div id="aiChatResult" style="margin-top:10px"></div>
    </div>

    <div id="aiContent">
      <div class="state"><div class="spinner"></div><div>載入AI分析...</div></div>
    </div>
  </div>
</div>

<style>
.ai-card {
  background: var(--card);
  border-radius: 16px;
  padding: 1rem 1.1rem;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 2px 8px var(--shadow);
}
.ai-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.ai-stock-name { font-size: 1rem; font-weight: 700; color: var(--text); }
.ai-stock-code { font-size: 0.72rem; color: var(--text3); margin-top: 1px; }
.ai-verdict {
  font-size: 0.72rem; font-weight: 600; padding: 3px 10px;
  border-radius: 12px; white-space: nowrap;
}
.ai-verdict.buy { background: #eaf5ea; color: var(--green); }
.ai-verdict.hold { background: #fef8ea; color: var(--yellow); }
.ai-verdict.avoid { background: #fef0ee; color: var(--red); }
.ai-section { margin-bottom: 8px; }
.ai-section-title {
  font-size: 0.7rem; font-weight: 600; color: var(--brown);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;
}
.ai-section-body { font-size: 0.78rem; color: var(--text2); line-height: 1.6; }
.ai-moat-score {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.72rem; color: var(--text3);
}
.ai-loading {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.78rem; color: var(--text3); padding: 8px 0;
}
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; z-index: 1000;
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: 0 -2px 12px var(--shadow);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 0.6rem 0.3rem; background: transparent; border: none;
  font-size: 0.6rem; color: var(--text3); cursor: pointer; font-family: inherit;
  transition: color 0.15s;
}
.nav-btn span:first-child { font-size: 1.2rem; }
.nav-btn.active { color: var(--brown); }

.bt-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.2rem; padding: 1rem 1.2rem;
  background: var(--card); border-radius: 18px;
  box-shadow: 0 2px 12px var(--shadow);
}

.bt-card {
  background: var(--card); border-radius: 16px;
  padding: 1rem 1.1rem; box-shadow: 0 2px 10px var(--shadow);
  margin-bottom: 8px; border-left: 4px solid transparent;
}
.bt-card.win { border-left-color: var(--green); }
.bt-card.lose { border-left-color: var(--red); }
.bt-card.pending { border-left-color: var(--text3); }

.bt-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.bt-stock-name { font-size: 0.95rem; font-weight: 700; }
.bt-stock-code { font-size: 0.65rem; color: var(--text3); margin-top: 2px; }
.bt-return { font-size: 1.1rem; font-weight: 700; }
.bt-return.pos { color: var(--red); }
.bt-return.neg { color: var(--blue); }
.bt-return.pending { color: var(--text3); font-size: 0.82rem; }

.bt-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-bottom: 6px; }
.bt-stat { background: var(--card2); border-radius: 8px; padding: 0.4rem 0.5rem; border: 1px solid var(--border); }
.bt-stat-label { font-size: 0.58rem; color: var(--text3); margin-bottom: 2px; }
.bt-stat-val { font-size: 0.78rem; font-weight: 500; color: var(--text); }

.bt-signal-date { font-size: 0.65rem; color: var(--text3); }
</style>



<script>
function showPage(page) {
  document.getElementById('navSignal').classList.toggle('active', page==='signal');
  document.getElementById('navSector').classList.toggle('active', page==='sector');
  document.getElementById('navBacktest').classList.toggle('active', page==='backtest');
  document.getElementById('navAI').classList.toggle('active', page==='ai');

  document.getElementById('signalPage').style.display = page==='signal' ? '' : 'none';
  document.getElementById('sectorPage').style.display = page==='sector' ? '' : 'none';
  document.getElementById('backtestPage').style.display = page==='backtest' ? '' : 'none';
  document.getElementById('aiPage').style.display = page==='ai' ? '' : 'none';

  if (page==='sector') loadSector();
  else if (page==='backtest') loadBacktest();
  else if (page==='ai') loadAI();
}

async function loadSector() {
  document.getElementById('sectorContent').innerHTML = '<div class="state"><div class="spinner"></div><div>載入板塊資料...</div></div>';
  // 確保訊號資料已載入
  if (!allStocks.length) await loadData();
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('板塊熱度')}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const start = text.indexOf('{'); const end = text.lastIndexOf('}');
    if(start===-1) throw new Error('格式錯誤');
    const json = JSON.parse(text.slice(start, end+1));
    const rows = json.table?.rows || [];
    if (!rows||rows.length<1) {
      document.getElementById('sectorContent').innerHTML = '<div class="state"><div style="font-size:2.5rem;margin-bottom:10px">🌾</div><div>還沒有板塊資料</div></div>';
      return;
    }
    const g = (c,i,fb='') => c[i]?(c[i].v!==null&&c[i].v!==undefined?c[i].v:(c[i].f||fb)):fb;
    
    const sectors = rows.map(row => {
      const c = row.c;
      return {
        date: String(g(c,0,'')),
        name: String(g(c,1,'')),
        count: Number(g(c,2,0)),
        avgScore: Number(g(c,3,0)),
        totalNet: Number(g(c,4,0)),
        avgNet: Number(g(c,5,0)),   // ★ 每檔平均
        buyCount: Number(g(c,6,0)),
        heat: String(g(c,7,''))
      };
    }).filter(s=>s.name);

    // 只取最新日期（處理Date物件和字串兩種格式）
    const parseDateStr = (v) => {
      if (!v) return '';
      const s = String(v);
      // Date物件格式如 "Date(2026,4,21)" → 月份從0開始
      const dm = s.match(/Date\((\d+),(\d+),(\d+)\)/);
      if (dm) return dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
      return s.substring(0,10);
    };
    const allDates = sectors.map(s=>parseDateStr(s.date)).filter(d=>d.length===10).sort();
    const latestDate = allDates[allDates.length-1] || '';
    const filteredSectors = sectors.filter(s=>parseDateStr(s.date)===latestDate);

    // ★ 改用每檔平均排序
    filteredSectors.sort((a,b) => b.avgNet - a.avgNet);

    const maxAvgNet = Math.max(...filteredSectors.map(s=>Math.abs(s.avgNet))) || 1;

    const html = filteredSectors.map(s => {
      const isHot = s.heat.includes('強勢');
      const isUp = s.heat.includes('偏強');
      const isDown = s.heat.includes('偏弱');
      const cardClass = isHot?'hot':isUp?'up':isDown?'down':'neutral';
      const barColor = isHot?'var(--red)':isUp?'var(--green)':isDown?'var(--blue)':'var(--text3)';
      const barPct = Math.abs(s.avgNet)/maxAvgNet*100;
      const netPos = s.avgNet > 0;
      const scoreColor = s.avgScore>=7?'var(--red)':s.avgScore>=5?'var(--yellow)':'var(--text)';

      // 從 allStocks 找該板塊的股票
      const sectorStocks = allStocks.filter(st => st.sector === s.name)
        .sort((a,b) => b.instNet - a.instNet);
      const buyStocks = sectorStocks.filter(st => st.op.includes('🟢'));
      const topStocks = sectorStocks.slice(0, 6);

      const stockListHtml = topStocks.length ? `
        <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
          <div style="font-size:0.62rem;color:var(--text3);margin-bottom:6px">本板塊個股（法人買超排序）</div>
          <div style="display:flex;flex-direction:column;gap:4px">
            ${topStocks.map(st => {
              const isBuy = st.op.includes('🟢');
              const isAvoid = st.op.includes('🔴') || st.op.includes('⬇️');
              const tagColor = isBuy?'var(--green)':isAvoid?'var(--red)':'var(--text3)';
              const tagBg = isBuy?'#eaf5ea':isAvoid?'#fef0ee':'var(--bg2)';
              const netColor = st.instNet>0?'color:var(--red)':'color:var(--blue)';
              return `<div style="display:flex;align-items:center;justify-content:space-between;
                background:var(--bg2);border-radius:8px;padding:4px 8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span style="font-size:0.72rem;font-weight:600">${st.name}</span>
                  <span style="font-size:0.6rem;color:var(--text3)">${st.code}</span>
                  <span style="font-size:0.6rem;background:${tagBg};color:${tagColor};
                    padding:1px 5px;border-radius:6px">${isBuy?'買入':isAvoid?'避開':'觀察'}</span>
                </div>
                <div style="font-size:0.7rem;font-weight:600;${netColor}">${st.instNet>0?'+':''}${st.instNet}張</div>
              </div>`;
            }).join('')}
          </div>
          ${buyStocks.length > 0 ? `
          <div style="margin-top:8px;padding:6px 8px;background:#eaf5ea;border-radius:8px;border-left:3px solid var(--green)">
            <div style="font-size:0.62rem;color:var(--green);font-weight:600;margin-bottom:3px">🟢 買入訊號 ${buyStocks.length} 檔</div>
            <div style="font-size:0.72rem;color:var(--text)">${buyStocks.map(st=>`${st.name}(${st.score}分)`).join('、')}</div>
          </div>` : ''}
        </div>` : '';

      return `<div class="sector-card ${cardClass}">
        <div class="sector-top">
          <div class="sector-name">${s.name}</div>
          <div class="sector-heat">${s.heat}</div>
        </div>
        <div class="sector-bar-bg">
          <div class="sector-bar-fill" style="width:${barPct}%;background:${barColor}"></div>
        </div>
        <div class="sector-stats">
          <div class="sector-stat">
            <div class="sector-stat-label">每檔均買(張)</div>
            <div class="sector-stat-val" style="color:${netPos?'var(--red)':'var(--blue)'}">${netPos?'+':''}${s.avgNet}</div>
          </div>
          <div class="sector-stat">
            <div class="sector-stat-label">平均評分</div>
            <div class="sector-stat-val" style="color:${scoreColor}">${s.avgScore}/12</div>
          </div>
          <div class="sector-stat">
            <div class="sector-stat-label">買入訊號</div>
            <div class="sector-stat-val" style="color:${s.buyCount>0?'var(--green)':'var(--text)'}">${s.buyCount}/${s.count}檔</div>
          </div>
        </div>
        ${stockListHtml}
      </div>`;
    }).join('');

    // 板塊熱力圖
    const maxAvgNetAbs = Math.max(...filteredSectors.map(s=>Math.abs(s.avgNet)), 1);
    const heatmapHtml = `
      <div style="margin-bottom:16px;background:var(--bg2);border-radius:12px;padding:12px;border:1px solid var(--border)">
        <div style="font-size:0.75rem;color:var(--text3);margin-bottom:10px;font-weight:600">🌡️ 板塊熱力圖 ${latestDate} — 顏色越深越熱，數字為每檔均買(張)</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
          ${filteredSectors.map(s => {
            const intensity = Math.abs(s.avgNet) / maxAvgNetAbs;
            const isPos = s.avgNet >= 0;
            const alpha = 0.15 + intensity * 0.75;
            const bg = isPos
              ? `rgba(192,88,72,${alpha})`
              : `rgba(72,120,160,${alpha})`;
            const textCol = intensity > 0.5 ? 'white' : 'var(--text)';
            const heatKey = s.heat.includes('強勢')?'🔥':s.heat.includes('偏強')?'📈':s.heat.includes('偏弱')?'📉':'➖';
            return `<div style="background:${bg};border-radius:10px;padding:8px 6px;text-align:center;border:1px solid var(--border)">
              <div style="font-size:0.62rem;font-weight:700;color:${textCol};margin-bottom:2px">${s.name.split('/')[0]}</div>
              <div style="font-size:0.72rem;font-weight:700;color:${textCol}">${isPos?'+':''}${s.avgNet}</div>
              <div style="font-size:0.58rem;color:${intensity>0.4?'rgba(255,255,255,0.8)':'var(--text3)'}">${heatKey} ${s.avgScore.toFixed(1)}分</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:12px;font-size:0.62rem;color:var(--text3);margin-top:8px">
          <span>🔴 紅=法人買超</span><span>🔵 藍=法人賣超</span><span>顏色越深=量越大</span>
        </div>
      </div>`;

    document.getElementById('sectorContent').innerHTML = heatmapHtml + html;
  } catch(e) {
    document.getElementById('sectorContent').innerHTML = '<div class="state">載入失敗：'+e.message+'</div>';
  }
}



async function loadBacktest() {
  document.getElementById('btContent').innerHTML = '<div class="state"><div class="spinner"></div><div>載入回測資料...</div></div>';

  // 欄位定義（對應 updateReturns 寫入順序）
  // A=0訊號日期 B=1代號 C=2名稱 D=3訊號 E=4總分
  // F=5當日收盤 G=6隔日開盤(進場) H=7 1日報酬% I=8 3日後收盤 J=9 3日報酬%
  const COL_DATE=0, COL_CODE=1, COL_NAME=2, COL_SCORE=4;
  const COL_CLOSE=5, COL_OPEN=6, COL_R1=7, COL_P3=8, COL_R3=9;

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('訊號歷史')}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const start = text.indexOf('{'); const end = text.lastIndexOf('}');
    if(start===-1) throw new Error('格式錯誤');
    const json = JSON.parse(text.slice(start, end+1));
    const rows = json.table?.rows || [];

    if (!rows || rows.length < 1) {
      document.getElementById('btContent').innerHTML = '<div class="state"><div style="font-size:2.5rem;margin-bottom:10px">🌱</div><div>還沒有回測資料<br><small style="font-size:0.75rem">每天收盤後自動記錄買入訊號<br>隔日自動計算報酬率</small></div></div>';
      return;
    }

    const g = (c, i, fb='') => {
      if (!c || i >= c.length || !c[i]) return fb;
      const v = c[i].v;
      return (v !== null && v !== undefined) ? v : (c[i].f || fb);
    };

    const parseNum = (v) => {
      if (v === '' || v === null || v === undefined) return null;
      const n = parseFloat(v);
      return isNaN(n) ? null : n;
    };

    const records = rows.map(row => {
      const c = row.c;
      const rawDate = String(g(c,COL_DATE,''));
      const dm = rawDate.match(/Date\((\d+),(\d+),(\d+)\)/);
      const date = dm ? dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0') : rawDate.substring(0,10);
      return {
        date,
        code:       String(g(c,COL_CODE,'')),
        name:       String(g(c,COL_NAME,'')),
        score:      parseNum(g(c,COL_SCORE,0)) ?? 0,
        entryClose: parseNum(g(c,COL_CLOSE,0)) ?? 0,  // 當日收盤（參考）
        entryOpen:  parseNum(g(c,COL_OPEN,'')),        // 隔日開盤（真正進場價）
        return1:    parseNum(g(c,COL_R1,'')),           // 1日報酬%
        price3:     parseNum(g(c,COL_P3,'')),           // 3日後收盤
        return3:    parseNum(g(c,COL_R3,'')),           // 3日報酬%
      };
    }).filter(r => r.code && r.code !== 'undefined');

    // 統計
    const has1d   = records.filter(r => r.return1 !== null);
    const has3d   = records.filter(r => r.return3 !== null);
    const pending = records.filter(r => r.return1 === null);

    const avg1d = has1d.length ? (has1d.reduce((s,r) => s + r.return1, 0) / has1d.length) : null;
    const avg3d = has3d.length ? (has3d.reduce((s,r) => s + r.return3, 0) / has3d.length) : null;

    // 8分以上統計
    const high1d = has1d.filter(r => r.score >= 8);
    const high3d = has3d.filter(r => r.score >= 8);
    const highAvg1d = high1d.length ? (high1d.reduce((s,r) => s+r.return1, 0) / high1d.length) : null;
    const highAvg3d = high3d.length ? (high3d.reduce((s,r) => s+r.return3, 0) / high3d.length) : null;

    document.getElementById('btTotal').textContent = records.length;
    document.getElementById('btPending').textContent = pending.length;

    // 更新統計數字（全部）
    const setStats = (recs) => {
      const h1 = recs.filter(r=>r.return1!==null);
      const h3 = recs.filter(r=>r.return3!==null);
      const a1 = h1.length ? h1.reduce((s,r)=>s+r.return1,0)/h1.length : null;
      const a3 = h3.length ? h3.reduce((s,r)=>s+r.return3,0)/h3.length : null;
      const r1El = document.getElementById('btWinRate');
      r1El.textContent = a1!==null ? (a1>=0?'+':'')+a1.toFixed(2)+'%' : '—';
      r1El.className = 'sum-val '+(a1===null?'brown':a1>=0?'green':'red');
      const avgEl = document.getElementById('btAvgReturn');
      avgEl.textContent = a3!==null ? (a3>=0?'+':'')+a3.toFixed(2)+'%' : '—';
      avgEl.className = 'sum-val '+(a3===null?'brown':a3>=0?'green':'red');
    };
    setStats(records);

    // 篩選按鈕
    const btns = [
      {label:'全部', score:0},
      {label:'8分↑', score:8},
      {label:'10分↑', score:10},
    ];
    const filterBar = `<div style="display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap">
      ${btns.map((b,i)=>`<button class="bt-filter-btn" data-score="${b.score}"
        style="font-size:0.72rem;padding:4px 14px;border-radius:20px;border:1px solid var(--border);
        background:${i===0?'var(--brown)':'var(--bg2)'};color:${i===0?'white':'var(--text2)'};cursor:pointer">
        ${b.label}（${records.filter(r=>r.score>=b.score).length}）</button>`).join('')}
    </div><div id="btCardsWrap"></div>`;

    document.getElementById('btContent').innerHTML = filterBar;

    const renderCards = (score) => {
      const filtered = score===0 ? records : records.filter(r=>r.score>=score);
      setStats(filtered);
      const html = filtered.slice().reverse().map(r => {
        const mainRet = r.return3!==null?r.return3:(r.return1!==null?r.return1:null);
        const mainLabel = r.return3!==null?'3日':(r.return1!==null?'1日':'');
        const isPending = mainRet===null;
        const cardClass = isPending?'pending':mainRet>=0?'win':'lose';
        const retText = isPending?'等待中...':`${mainLabel} ${mainRet>=0?'+':''}${mainRet.toFixed(2)}%`;
        const retClass = isPending?'pending':mainRet>=0?'pos':'neg';
        const r1Text = r.return1!==null?`${r.return1>=0?'+':''}${r.return1.toFixed(2)}%`:'—';
        const r3Text = r.return3!==null?`${r.return3>=0?'+':''}${r.return3.toFixed(2)}%`:'—';
        const r1Class = r.return1!==null?(r.return1>=0?'pos':'neg'):'';
        const r3Class = r.return3!==null?(r.return3>=0?'pos':'neg'):'';
        const entryPrice = r.entryOpen||r.entryClose;
        const entryLabel = r.entryOpen?'隔日開盤':'當日收盤';
        return `<div class="bt-card ${cardClass}">
          <div class="bt-card-top">
            <div>
              <div class="bt-stock-name">${r.name} <span style="font-size:0.65rem;background:var(--bg2);padding:1px 6px;border-radius:10px;color:var(--text3)">${r.score}分</span></div>
              <div class="bt-stock-code">${r.code} · ${r.date}</div>
            </div>
            <div class="bt-return ${retClass}">${retText}</div>
          </div>
          <div class="bt-stats">
            <div class="bt-stat"><div class="bt-stat-label">${entryLabel}</div><div class="bt-stat-val">$${entryPrice||'—'}</div></div>
            <div class="bt-stat"><div class="bt-stat-label">1日報酬</div><div class="bt-stat-val ${r1Class}">${r1Text}</div></div>
            <div class="bt-stat"><div class="bt-stat-label">3日報酬</div><div class="bt-stat-val ${r3Class}">${r3Text}</div></div>
          </div>
        </div>`;
      }).join('');
      document.getElementById('btCardsWrap').innerHTML = html||'<div class="state">沒有資料</div>';
    };

    document.querySelectorAll('.bt-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bt-filter-btn').forEach(b=>{b.style.background='var(--bg2)';b.style.color='var(--text2)';});
        btn.style.background='var(--brown)'; btn.style.color='white';
        renderCards(parseInt(btn.dataset.score));
      });
    });
    renderCards(0);

  } catch(e) {
    console.error('[Backtest] 錯誤:', e);
    document.getElementById('btContent').innerHTML = `<div class="state">載入失敗：${e.message}</div>`;
  }
}

// AI 分析頁
// ═══════════════════════════════════════════
async function sendAIChat() {
  const input = document.getElementById('aiChatInput');
  const result = document.getElementById('aiChatResult');
  const q = input.value.trim();
  if (!q) return;

  result.innerHTML = '<div class="state" style="padding:1rem 0"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px"></div><div style="font-size:0.75rem">AI分析中...</div></div>';

  const isCode = /^\d{4}$/.test(q);

async function loadAI() {
  document.getElementById('aiContent').innerHTML = '<div class="state"><div class="spinner"></div><div>載入AI分析資料...</div></div>';
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('AI分析')}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
    const rows = json.table?.rows || [];

    if (!rows.length) {
      document.getElementById('aiContent').innerHTML = '<div class="state">尚無AI分析資料<br><span style="font-size:0.75rem;color:var(--text3)">等待明日凌晨自動分析</span></div>';
      return;
    }

    const g = (r,i,def='') => r.c?.[i]?.v ?? def;

    // 收集所有日期
    const parseDateVal = (v) => {
      if (!v) return '';
      const s = String(v);
      const dm = s.match(/Date\((\d+),(\d+),(\d+)\)/);
      if (dm) return dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
      if (s.match(/^\d{4}-\d{2}-\d{2}/)) return s.substring(0,10);
      const months = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
      const mp = s.match(/\w{3}\s+(\w{3})\s+(\d+)/);
      if (mp && months[mp[1]]) return '2026-'+months[mp[1]]+'-'+String(mp[2]).padStart(2,'0');
      return s.substring(0,10);
    };
    const dates = [...new Set(rows.map(r => parseDateVal(g(r,0,''))).filter(d=>d&&d.length>=10))].sort().reverse();

    // 日期選擇器
    const sel = document.getElementById('aiDateSelect');
    sel.innerHTML = dates.map((d,i) => `<option value="${d}">${i===0?'最新 '+d:d}</option>`).join('');

    loadAIByDate(dates[0], rows);
  } catch(e) {
    document.getElementById('aiContent').innerHTML = `<div class="state">載入失敗：${e.message}</div>`;
  }
}

function renderKBar(data) {
  const W = 300, H = 80, PAD = 4;
  const highs = data.map(d => parseFloat(d.max));
  const lows  = data.map(d => parseFloat(d.min));
  const maxP = Math.max(...highs);
  const minP = Math.min(...lows);
  const range = maxP - minP || 1;
  const n = data.length;
  const bw = Math.floor((W - PAD*2) / n) - 1;
  const bw2 = Math.max(1, bw);

  const toY = p => PAD + (maxP - p) / range * (H - PAD*2);

  const bars = data.map((d, i) => {
    const o = parseFloat(d.open);
    const c = parseFloat(d.close);
    const h = parseFloat(d.max);
    const l = parseFloat(d.min);
    const x = PAD + i * (bw2 + 1) + bw2/2;
    const isUp = c >= o;
    const col = isUp ? '#c05848' : '#4878a0';
    const bodyTop = toY(Math.max(o,c));
    const bodyBot = toY(Math.min(o,c));
    const bodyH = Math.max(1, bodyBot - bodyTop);
    return `<line x1="${x}" y1="${toY(h)}" x2="${x}" y2="${toY(l)}" stroke="${col}" stroke-width="1"/>
<rect x="${x-bw2/2}" y="${bodyTop}" width="${bw2}" height="${bodyH}" fill="${col}" rx="0.5"/>`;
  }).join('');

  // MA5
  const ma5 = data.map((_,i) => {
    if (i < 4) return null;
    const avg = data.slice(i-4, i+1).reduce((s,d) => s+parseFloat(d.close), 0) / 5;
    return {x: PAD + i*(bw2+1)+bw2/2, y: toY(avg)};
  }).filter(Boolean);
  const ma5Line = ma5.length > 1 ? `<polyline points="${ma5.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#c8a84b" stroke-width="1" opacity="0.8"/>` : '';

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:80px;border-radius:8px">${bars}${ma5Line}</svg>`;
}

const COL = {
  date:0,code:1,name:2,op:3,score:4,
  instNet:5,streak:6,conc5:7,abnormal:8,
  volS:9,momS:10,instS:11,concS:12,rsiS:13,kdS:14,
  price:15,rsi:16,kVal:17,dVal:18,sector:19,vol:20,reasons:21,
  marginBal:22,marginChg:23,shortBal:24,shortRatio:25,
  foreign:26,trust:27,dealer:28
};

function getOpClass(op) {
  if (!op) return 'neutral';
  if (op.includes('🟢')) return 'buy';
  if (op.includes('🟡')) return 'watch';
  if (op.includes('⬇️')) return 'bear';
  if (op.includes('🔴')) return 'avoid';
  return 'neutral';
}
function getBarColor(s,m) { const p=s/m; return p>=0.75?'#5a9460':p>=0.5?'#c08830':p>=0.25?'#a07850':'#d0c8bc'; }
function parseReasons(str) { return (str||'').split('|').map(s=>s.trim()).filter(Boolean); }
function rClass(r) {
  // 🟢 綠色 = 正面訊號
  if (/四大條件|營收創年高|量創本季新高|站上|法人買|連買|外資連|投信連|甜蜜|多頭排列|集中度3日上升|融資減/.test(r)) return 'good';
  // 🔴 橘紅色 = 警示訊號  
  if (/賣|縮量|空頭|過熱|警示|融資增.*警示/.test(r)) return 'warn';
  // 🔵 藍灰色 = 中性資訊
  return 'info';
}

async function generateDailySummary() {
  const section = document.getElementById('dailySummarySection');
  const card = document.getElementById('dailySummaryCard');
  if (!section || !card || !allStocks.length) return;

  section.style.display = '';
  card.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0.5rem auto"></div>';

  // ★ 板塊統計：過濾掉無效板塊名稱，用每檔平均排序
  const VALID_SECTORS = ['半導體/IC設計','封測','AI伺服器/ODM','電源/散熱','PCB/載板','網通/連接','光電/面板','被動元件/機構','記憶體','其他電子'];
  const sectorMap = {};
  allStocks.forEach(s => {
    const sec = VALID_SECTORS.includes(s.sector) ? s.sector : '其他電子';
    if (!sectorMap[sec]) sectorMap[sec] = {buy:0, total:0, netSum:0};
    sectorMap[sec].total++;
    if (s.op.includes('🟢')) sectorMap[sec].buy++;
    sectorMap[sec].netSum += (typeof s.instNet === 'number' ? s.instNet : 0);
  });

  const sectorList = Object.entries(sectorMap)
    .map(([name, d]) => ({
      name,
      total: d.total,
      buy: d.buy,
      netSum: d.netSum,
      avgNet: d.total ? Math.round(d.netSum / d.total) : 0,
      buyRatio: d.total ? (d.buy / d.total * 100).toFixed(0) : 0
    }))
    .sort((a,b) => b.avgNet - a.avgNet);

  const topSectors = sectorList.slice(0, 3).map(s =>
    `${s.name}(每檔均買${s.avgNet}張, 買入訊號${s.buyRatio}%)`
  );
  const bottomSectors = sectorList.filter(s => s.avgNet < 0).slice(0, 2).map(s =>
    `${s.name}(每檔均賣${Math.abs(s.avgNet)}張)`
  );

  // ★ highStreak 去重（同一股票只出現一次）
  const seen = {};
  const highStreak = allStocks
    .filter(s => s.streak >= 3 && !seen[s.code] && (seen[s.code] = true))
    .sort((a,b) => b.streak - a.streak)
    .slice(0, 3)
    .map(s => `${s.name}(連買${s.streak}天)`);

  const cntBuy = allStocks.filter(s=>s.op.includes('🟢')).length;
  const cntWatch = allStocks.filter(s=>s.op.includes('🟡')).length;
  const dateStr = document.getElementById('dateTag').textContent;

  const prompt = `你是台股法人籌碼分析師。請用繁體中文、自然口語、約100字，寫一段今日盤後總結評論。

今日（${dateStr}）掃描 ${allStocks.length} 檔電子科技股：
- 買入訊號 ${cntBuy} 檔，觀察 ${cntWatch} 檔
- 法人每檔平均買超最多板塊：${topSectors.join('；')}
- 法人流出板塊：${bottomSectors.length ? bottomSectors.join('；') : '無明顯流出'}
- 連續買超3天以上個股：${highStreak.length ? highStreak.join('、') : '無'}

請直接輸出評論文字，不要加任何標題或Markdown格式。重點是點出法人資金集中流向哪個板塊、值得關注的個股，口吻像投顧分析師每日收盤短評，語氣專業簡潔。`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '無法生成總結';
    card.innerHTML = text.replace(/\n/g, '<br>');
  } catch(e) {
    card.innerHTML = buildStaticSummary(sectorList, cntBuy, highStreak, dateStr);
  }
}

function buildStaticSummary(sectorList, cntBuy, highStreak, dateStr) {
  const top1 = sectorList[0];
  const top2 = sectorList[1];
  const bot1 = sectorList.filter(s=>s.netSum<0).slice(-1)[0];
  let text = `<strong>${dateStr}</strong> 盤後，今日法人資金主要流向 <strong>${top1?.name||'—'}</strong>`;
  if (top2) text += ` 及 <strong>${top2.name}</strong>`;
  text += ` 板塊。`;
  if (bot1) text += `<br>資金持續流出 <strong>${bot1.name}</strong> 板塊。`;
  if (highStreak.length) text += `<br>${highStreak.join('、')} 法人連續買超值得關注。`;
  text += `<br>今日共出現 <strong>${cntBuy}</strong> 檔買入訊號，整體籌碼偏${cntBuy >= 15 ? '積極' : cntBuy >= 8 ? '中性' : '保守'}。`;
  return text;
}

function searchStock(name) {
  document.getElementById('searchInput').value = name;
  renderCards();
  document.getElementById('searchInput').scrollIntoView({behavior:'smooth'});
}

function jumpToStock(name) {
  showPage('signal');
  setTimeout(() => {
    document.getElementById('searchInput').value = name;
    renderCards();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }, 100);
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="state"><div class="spinner"></div><div>載入資料中...</div></div>';
  document.getElementById('errorBox').style.display = 'none';
  
  const selectedDate = document.getElementById('dateSelect')?.value || '';
  
  // Load from 訊號日誌 if date selected, otherwise from 訊號看板
  const sheetName = selectedDate ? '訊號日誌' : SHEET_NAME;
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const start = text.indexOf('{'); const end = text.lastIndexOf('}'); if(start===-1) throw new Error('格式錯誤'); const json = JSON.parse(text.slice(start, end+1));
    const rows = json.table.rows;
    if (!rows||rows.length<2) { showError('Google Sheet 沒有資料，請先執行 Apps Script！'); return; }
    // Get all available dates for dropdown
    const allRows = rows.slice(1);
    const dateSelect = document.getElementById('dateSelect');
    if (dateSelect) {
      const dates = [...new Set(allRows.map(row => {
        const c = row.c;
        const rawDate = String(c[0] ? (c[0].v || c[0].f || '') : '');
        const dm = rawDate.match(/Date\((\d+),(\d+),(\d+)\)/);
        return dm ? dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(parseInt(dm[3])).padStart(2,'0') : rawDate.substring(0,10);
      }).filter(d => d && d.length === 10))].sort().reverse();
      
      const currentVal = dateSelect.value;
      dateSelect.innerHTML = dates.map((d,i) => 
        `<option value="${d}" ${(currentVal===d||(currentVal===''&&i===0))?'selected':''}>${i===0?'📅 最新 '+d:'📅 '+d}</option>`
      ).join('');
      
      // If no date selected, don't filter; if date selected filter by it
    }
    
    const filterDate = dateSelect?.value || '';
    const filteredRows = filterDate ? allRows.filter(row => {
      const c = row.c;
      const rawDate = String(c[0] ? (c[0].v || c[0].f || '') : '');
      const dm = rawDate.match(/Date\((\d+),(\d+),(\d+)\)/);
      const d = dm ? dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(parseInt(dm[3])).padStart(2,'0') : rawDate.substring(0,10);
      return d === filterDate;
    }) : allRows;

    allStocks = filteredRows.map(row => {
      const c=row.c; const g=(i,fb='')=>c[i]?(c[i].v!==null&&c[i].v!==undefined?c[i].v:(c[i].f||fb)):fb;
      return {
        date:String(g(COL.date,'')),code:String(g(COL.code,'')),name:String(g(COL.name,'')),
        price:g(COL.price,0),score:Number(g(COL.score,0)),
        volS:Number(g(COL.volS,0)),momS:Number(g(COL.momS,0)),instS:Number(g(COL.instS,0)),
        concS:Number(g(COL.concS,0)),rsiS:Number(g(COL.rsiS,0)),kdS:Number(g(COL.kdS,0)),
        instNet:Number(g(COL.instNet,0)),streak:Number(g(COL.streak,0)),
        conc5:String(g(COL.conc5,'')),rsi:String(g(COL.rsi,'')),
        kVal:String(g(COL.kVal,'')),dVal:String(g(COL.dVal,'')),
        abnormal:String(g(COL.abnormal,'')),op:String(g(COL.op,'')),
        sector:String(g(COL.sector,'')),vol:Number(g(COL.vol,0)),
        reasons:String(g(COL.reasons,'')),
        marginBal:Number(g(COL.marginBal,0)),
        marginChg:Number(g(COL.marginChg,0)),
        shortBal:Number(g(COL.shortBal,0)),
        shortRatio:Number(g(COL.shortRatio,0)),
        foreign:Number(g(COL.foreign,0)),
        trust:Number(g(COL.trust,0)),
        dealer:Number(g(COL.dealer,0))
      };
    }).filter(s=>s.code);
    const cntBuy=allStocks.filter(s=>s.op.includes('🟢')).length;
    const cntWatch=allStocks.filter(s=>s.op.includes('🟡')).length;
    const cntAvoid=allStocks.filter(s=>s.op.includes('🔴')||s.op.includes('⬇️')).length;
    const top=allStocks.length?Math.max(...allStocks.map(s=>s.score)):0;
    // summary stats removed
    const rawDate=String(allStocks[0]?.date||'');const dm=rawDate.match(/Date\((\d+),(\d+),(\d+)\)/);document.getElementById('dateTag').textContent=dm?dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0'):rawDate.substring(0,10)||'—';
    renderCards();
    generateDailySummary();
  } catch(e) { showError('載入失敗：'+e.message+'（請確認 Google Sheet 已設為公開）'); }
}

function showError(msg) {
  document.getElementById('errorBox').textContent='⚠ '+msg;
  document.getElementById('errorBox').style.display='block';
  document.getElementById('content').innerHTML='';
}

function setFilter(f,el) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); renderCards();
}

function renderCards() {
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const MAX=15;
  let list=allStocks.filter(s=>{
    if(q&&!s.name.toLowerCase().includes(q)&&!s.code.includes(q)) return false;
    if(currentFilter==='buy') return s.op.includes('🟢');
    if(currentFilter==='watch') return s.op.includes('🟡');
    if(currentFilter==='avoid') return s.op.includes('🔴');
    if(currentFilter==='bear') return s.op.includes('⬇️');
    return true;
  });
  // 由高分到低分排序
  list.sort((a,b) => b.score - a.score);
  if(!list.length){document.getElementById('content').innerHTML='<div class="state"><div style="font-size:2.5rem;margin-bottom:10px">🌾</div><div>沒有符合條件的股票</div></div>';return;}
  const pipDefs=[{label:'量能',key:'volS',max:2},{label:'動能',key:'momS',max:3},{label:'法人',key:'instS',max:3},{label:'集中',key:'concS',max:2},{label:'RSI',key:'rsiS',max:1},{label:'KD',key:'kdS',max:1}];
  const html=list.map((s,i)=>{
    const opClass=getOpClass(s.op);
    const barPct=Math.min(s.score/MAX*100,100);
    const barColor=getBarColor(s.score,MAX);
    const pos=s.instNet>0;
    const reasons=parseReasons(s.reasons);
    const pips=pipDefs.map(p=>`<span class="pip ${s[p.key]>0?'on':''}">${p.label} ${s[p.key]}/${p.max}</span>`).join('');

    // 融資顏色
    const mChgColor = s.marginChg > 0 ? 'color:var(--red)' : s.marginChg < 0 ? 'color:var(--blue)' : 'color:var(--text2)';
    const mChgText = s.marginChg > 0 ? '+'+s.marginChg : String(s.marginChg);

    // 外資/投信/自營顏色
    const fColor = s.foreign > 0 ? 'color:var(--red)' : s.foreign < 0 ? 'color:var(--blue)' : 'color:var(--text2)';
    const tColor = s.trust > 0 ? 'color:var(--red)' : s.trust < 0 ? 'color:var(--blue)' : 'color:var(--text2)';
    const dColor = s.dealer > 0 ? 'color:var(--red)' : s.dealer < 0 ? 'color:var(--blue)' : 'color:var(--text2)';

    // 四大條件標記
    const fourCond = reasons.some(r => r.includes('四大條件'));
    const fourCondBadge = fourCond ? `<span style="background:#fff3cd;color:#856404;border-radius:6px;padding:2px 8px;font-size:0.68rem;font-weight:700;margin-left:6px">🎯 四大條件</span>` : '';

    return `<div class="card op-${opClass}" style="animation-delay:${Math.min(i*0.04,0.6)}s">
      <div class="card-header">
        <div>
          <div class="stock-name">${s.name}${fourCondBadge}</div>
          <div class="stock-code">${s.code}${s.sector?' · '+s.sector:''}</div>
        </div>
        <div class="price">$${s.price}</div>
      </div>
      <div class="op-badge ${opClass}">${s.op||'－'}</div>
      <div class="score-section">
        <div class="score-top"><span class="score-text">綜合評分</span><span class="score-num">${s.score} / ${MAX} 分</span></div>
        <div class="score-bar-bg"><div class="score-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-label">法人淨買(張)</div><div class="stat-val ${pos?'pos':'neg'}">${pos?'+':''}${s.instNet}</div></div>
        <div class="stat-box"><div class="stat-label">連續買超</div><div class="stat-val neu">${s.streak} 天</div></div>
        <div class="stat-box"><div class="stat-label">五日集中%</div><div class="stat-val neu">${s.conc5}</div></div>
        <div class="stat-box"><div class="stat-label">RSI(14)</div><div class="stat-val neu">${s.rsi}</div></div>
        <div class="stat-box"><div class="stat-label">K / D</div><div class="stat-val neu">${s.kVal}/${s.dVal}</div></div>
        <div class="stat-box"><div class="stat-label">異常倍數</div><div class="stat-val neu">${s.abnormal}</div></div>
      </div>

      <!-- 外資/投信/自營 -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px">
        <div class="stat-box"><div class="stat-label">外資(張)</div><div class="stat-val" style="${fColor}">${s.foreign>0?'+':''}${s.foreign}</div></div>
        <div class="stat-box"><div class="stat-label">投信(張)</div><div class="stat-val" style="${tColor}">${s.trust>0?'+':''}${s.trust}</div></div>
        <div class="stat-box"><div class="stat-label">自營(張)</div><div class="stat-val" style="${dColor}">${s.dealer>0?'+':''}${s.dealer}</div></div>
      </div>

      <!-- 融資融券 -->
      <div style="background:var(--card2);border-radius:10px;padding:0.5rem 0.7rem;margin-top:8px;margin-bottom:8px;border:1px solid var(--border)">
        <div style="font-size:0.65rem;color:var(--text3);margin-bottom:4px">融資融券</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <span style="font-size:0.75rem;color:var(--text2)">融資 <strong>${s.marginBal}</strong>張 <span style="${mChgColor};font-size:0.7rem">(${mChgText})</span></span>
          <span style="font-size:0.75rem;color:var(--text2)">融券 <strong>${s.shortBal}</strong>張</span>
          <span style="font-size:0.75rem;color:var(--text2)">券資比 <strong>${s.shortRatio}%</strong></span>
        </div>
      </div>

      <div class="breakdown">${pips}</div>
      <div class="reasons">${reasons.map(r=>`<span class="rtag ${rClass(r)}">${r}</span>`).join('')}</div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML=`<div class="cards">${html}</div>`;
}

async function loadNews() {
  const el = document.getElementById('newsContent');
  if (!el) return;
  el.innerHTML = '<div class="spinner" style="width:20px;height:20px;margin:0.5rem auto"></div>';
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('每日新聞')}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
    const rows = json.table?.rows || [];
    if (!rows.length) { el.innerHTML = '<div style="font-size:0.78rem;color:var(--text3);text-align:center;padding:8px">尚無新聞資料，等待今日更新</div>'; return; }

    const g = (c,i) => c[i]?.v ?? '';
    const parseNewsDate = (v) => {
      const s = String(v);
      const dm = s.match(/Date\((\d+),(\d+),(\d+)/);
      if (dm) return dm[1]+'-'+String(parseInt(dm[2])+1).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
      return s.substring(0,10);
    };
    const today = rows.map(r => parseNewsDate(g(r.c,0))).filter(d=>d).sort().reverse()[0];
    const todayRows = rows.filter(r => parseNewsDate(g(r.c,0)) === today);

    const catColors = {
      '記憶體':'#4878a0','AI供應鏈':'#c05848','半導體':'#a07850',
      'AI晶片':'#c05848','機器人':'#5a9460','台股籌碼':'#7a5830'
    };

    const updateTime = todayRows.length ? today : '';
    el.innerHTML = `
      <div style="font-size:0.62rem;color:var(--text3);margin-bottom:8px">${updateTime} 更新</div>
      ${todayRows.map(r => {
        const title = String(g(r.c,1));
        const summary = String(g(r.c,2));
        const cat = String(g(r.c,3));
        const col = catColors[cat] || 'var(--brown)';
        return `<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span style="font-size:0.6rem;background:${col};color:white;padding:1px 6px;border-radius:6px;white-space:nowrap">${cat}</span>
            <span style="font-size:0.78rem;font-weight:600;color:var(--text);line-height:1.4">${title}</span>
          </div>
          ${summary?`<div style="font-size:0.72rem;color:var(--text2);line-height:1.5;padding-left:2px">${summary}</div>`:''}
        </div>`;
      }).join('')}`;
  } catch(e) {
    el.innerHTML = `<div style="font-size:0.78rem;color:var(--text3);text-align:center">載入失敗</div>`;
  }
}

    const el=document.createElement('div');
    el.id='pwa-hint';
    el.innerHTML=`<div style="flex:1">📲 Safari <strong>分享 □↑</strong> → <strong>加入主畫面</strong>，像 App 使用</div><button onclick="this.parentElement.remove();localStorage.setItem('pwa-dismissed','1')" style="background:transparent;border:none;color:rgba(255,255,255,0.6);font-size:1.1rem;cursor:pointer;flex-shrink:0">✕</button>`;
    document.body.appendChild(el);
  },2000);
}
