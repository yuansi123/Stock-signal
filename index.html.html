<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="訊號看板">
<meta name="theme-color" content="#0a0c10">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230a0c10'/%3E%3Ccircle cx='90' cy='90' r='60' fill='none' stroke='%2300d4aa' stroke-width='6'/%3E%3Cpolyline points='50,110 75,75 100,95 130,55' fill='none' stroke='%2300d4aa' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='130' cy='55' r='7' fill='%2334c77b'/%3E%3C/svg%3E">
<title>籌碼訊號看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2533;
  --accent: #00d4aa;
  --red: #f04e4e;
  --yellow: #f5c842;
  --green: #34c77b;
  --blue: #4a8ef0;
  --text: #e8edf5;
  --muted: #4a5a70;
  --muted2: #252d3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}

/* Grid bg */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,212,170,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,170,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none; z-index: 0;
}

.wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; position: relative; z-index: 1; }

/* Header */
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.8rem; flex-wrap: wrap; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
h1 { font-family: 'DM Mono', monospace; font-size: 1.2rem; letter-spacing: 0.1em; }
.header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.date-tag { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.7rem; }
.refresh-btn { background: var(--accent); color: #000; border: none; border-radius: 7px; padding: 0.4rem 0.9rem; font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
.refresh-btn:hover { opacity: 0.8; }

/* Summary cards */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.4rem; }
.sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; }
.sum-label { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.07em; font-family: 'DM Mono', monospace; margin-bottom: 4px; }
.sum-val { font-family: 'DM Mono', monospace; font-size: 1.3rem; font-weight: 500; }
.sum-val.green { color: var(--green); }
.sum-val.yellow { color: var(--yellow); }
.sum-val.red { color: var(--red); }
.sum-val.blue { color: var(--blue); }

/* Filter tabs */
.filters { display: flex; gap: 6px; margin-bottom: 1.2rem; flex-wrap: wrap; }
.filter-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.8rem; font-size: 0.73rem; color: var(--muted); cursor: pointer; transition: all 0.18s; font-family: 'DM Mono', monospace; }
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: rgba(0,212,170,0.1); border-color: var(--accent); color: var(--accent); }

/* Search */
.search-row { margin-bottom: 1.2rem; }
.search-input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 1rem; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.82rem; outline: none; width: 100%; max-width: 280px; transition: border-color 0.2s; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

/* Cards grid */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1rem 1.1rem;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.2s;
  animation: fadeUp 0.4s ease both;
  cursor: default;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.card.op-buy { border-color: rgba(52,199,123,0.4); }
.card.op-watch { border-color: rgba(245,200,66,0.35); }
.card.op-avoid { border-color: rgba(240,78,78,0.35); }
.card.op-bear { border-color: rgba(100,100,120,0.4); }

@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.stock-info {}
.stock-name { font-weight: 700; font-size: 1rem; }
.stock-code { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
.price-block { text-align: right; }
.price { font-family: 'DM Mono', monospace; font-size: 1.1rem; font-weight: 500; }

/* Score bar */
.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.score-bar-bg { flex: 1; height: 5px; background: var(--muted2); border-radius: 3px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.score-label { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

/* Op badge */
.op-badge { display: inline-block; font-size: 0.72rem; font-family: 'DM Mono', monospace; padding: 0.2rem 0.55rem; border-radius: 5px; margin-bottom: 8px; font-weight: 500; }
.op-badge.buy { background: rgba(52,199,123,0.15); color: var(--green); border: 1px solid rgba(52,199,123,0.3); }
.op-badge.watch { background: rgba(245,200,66,0.12); color: var(--yellow); border: 1px solid rgba(245,200,66,0.25); }
.op-badge.avoid { background: rgba(240,78,78,0.1); color: var(--red); border: 1px solid rgba(240,78,78,0.2); }
.op-badge.bear { background: rgba(100,100,120,0.15); color: #8899aa; border: 1px solid rgba(100,100,120,0.25); }
.op-badge.neutral { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

/* Mini stats */
.mini-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 8px; }
.mini-stat { background: var(--surface2); border-radius: 6px; padding: 0.35rem 0.5rem; }
.mini-stat-label { font-size: 0.6rem; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 2px; }
.mini-stat-val { font-size: 0.8rem; font-family: 'DM Mono', monospace; }
.mini-stat-val.pos { color: var(--red); }
.mini-stat-val.neg { color: var(--blue); }
.mini-stat-val.neutral { color: var(--text); }

/* Reasons */
.reasons { font-size: 0.68rem; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--muted2); padding-top: 7px; }
.reason-tag { display: inline-block; background: var(--muted2); border-radius: 3px; padding: 0.08rem 0.35rem; margin: 1px 2px 1px 0; font-family: 'DM Mono', monospace; }
.reason-tag.good { background: rgba(52,199,123,0.1); color: var(--green); }
.reason-tag.warn { background: rgba(240,78,78,0.1); color: var(--red); }
.reason-tag.info { background: rgba(0,212,170,0.08); color: var(--accent); }

/* Loading / empty */
.state { text-align: center; padding: 5rem 1rem; color: var(--muted); }
.spinner { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { background: rgba(240,78,78,0.08); border: 1px solid rgba(240,78,78,0.2); border-radius: 10px; padding: 1rem 1.2rem; color: var(--red); font-size: 0.82rem; margin-bottom: 1rem; }

/* Responsive */
@media (max-width: 600px) {
  .summary { grid-template-columns: repeat(2, 1fr); }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      <h1>籌碼訊號看板</h1>
    </div>
    <div class="header-right">
      <span class="date-tag" id="dateTag">—</span>
      <button class="refresh-btn" onclick="loadData()">↻ 重新載入</button>
    </div>
  </header>

  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">🟢 買入參考</div>
      <div class="sum-val green" id="cntBuy">—</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">🟡 觀察中</div>
      <div class="sum-val yellow" id="cntWatch">—</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">🔴 避開</div>
      <div class="sum-val red" id="cntAvoid">—</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">總分最高</div>
      <div class="sum-val blue" id="topScore">—</div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" onclick="setFilter('buy',this)">🟢 買入</button>
    <button class="filter-btn" onclick="setFilter('watch',this)">🟡 觀察</button>
    <button class="filter-btn" onclick="setFilter('avoid',this)">🔴 避開</button>
    <button class="filter-btn" onclick="setFilter('bear',this)">⬇️ 空頭</button>
  </div>

  <div class="search-row">
    <input class="search-input" id="searchInput" placeholder="搜尋股票名稱或代號..." oninput="renderCards()">
  </div>

  <div id="errorBox" class="error-box" style="display:none"></div>
  <div id="content"><div class="state"><div class="spinner"></div><div>載入資料中...</div></div></div>
</div>

<script>
const SHEET_ID = '17JrdvcOghYVQpMNjJdd7Jkwu0RxNhkC5eqtIF7NAuIg';
const SHEET_NAME = '訊號看板';

let allStocks = [];
let currentFilter = 'all';

// Col indices (0-based): 日期0 代號1 名稱2 收盤3 總分4 量能分5 動能分6 法人分7 集中分8 RSI分9 KD分10 法人合計11 連續12 五日集中13 佔股本14 RSI15 K16 D17 異常18 操作19 說明20
const COL = {
  date:0, code:1, name:2, price:3, score:4,
  volS:5, momS:6, instS:7, concS:8, rsiS:9, kdS:10,
  instNet:11, streak:12, conc5:13, stockPct:14,
  rsi:15, kVal:16, dVal:17, abnormal:18,
  op:19, reasons:20
};

function getOpClass(op) {
  if (!op) return 'neutral';
  if (op.includes('🟢')) return 'buy';
  if (op.includes('🟡')) return 'watch';
  if (op.includes('⬇️')) return 'bear';
  if (op.includes('🔴')) return 'avoid';
  return 'neutral';
}

function getScoreColor(score, max) {
  const pct = score / max;
  if (pct >= 0.75) return '#34c77b';
  if (pct >= 0.5) return '#f5c842';
  if (pct >= 0.25) return '#f0844a';
  return '#4a5a70';
}

function parseReasons(str) {
  if (!str) return [];
  return str.split('|').map(s => s.trim()).filter(Boolean);
}

function reasonClass(r) {
  if (r.includes('站上') || r.includes('買超') || r.includes('甜蜜') || r.includes('連買') || r.includes('放大') || r.includes('多頭') || r.includes('新高')) return 'good';
  if (r.includes('賣') || r.includes('縮') || r.includes('空頭') || r.includes('過熱') || r.includes('超買')) return 'warn';
  return 'info';
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="state"><div class="spinner"></div><div>載入資料中...</div></div>';
  document.getElementById('errorBox').style.display = 'none';

  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

  try {
    const res = await fetch(url);
    const text = await res.text();
    // Google wraps response in /*O_o*/\ngoogle.visualization.Query.setResponse({...});
    const json = JSON.parse(text.replace(/^.*?\(/, '').replace(/\);?\s*$/, ''));
    const rows = json.table.rows;
    if (!rows || rows.length < 2) {
      showError('Google Sheet 沒有資料，請先執行 Apps Script 取得資料！');
      return;
    }

    // Skip header row (row 0 is headers)
    allStocks = rows.slice(1).map(row => {
      const c = row.c;
      return {
        date:    c[COL.date]  ? (c[COL.date].v || c[COL.date].f || '') : '',
        code:    c[COL.code]  ? String(c[COL.code].v || '') : '',
        name:    c[COL.name]  ? String(c[COL.name].v || '') : '',
        price:   c[COL.price] ? (c[COL.price].v || 0) : 0,
        score:   c[COL.score] ? (c[COL.score].v || 0) : 0,
        volS:    c[COL.volS]  ? (c[COL.volS].v || 0) : 0,
        momS:    c[COL.momS]  ? (c[COL.momS].v || 0) : 0,
        instS:   c[COL.instS] ? (c[COL.instS].v || 0) : 0,
        concS:   c[COL.concS] ? (c[COL.concS].v || 0) : 0,
        rsiS:    c[COL.rsiS]  ? (c[COL.rsiS].v || 0) : 0,
        kdS:     c[COL.kdS]   ? (c[COL.kdS].v || 0) : 0,
        instNet: c[COL.instNet]? (c[COL.instNet].v || 0) : 0,
        streak:  c[COL.streak] ? (c[COL.streak].v || 0) : 0,
        conc5:   c[COL.conc5] ? String(c[COL.conc5].v || '') : '',
        stockPct:c[COL.stockPct]? String(c[COL.stockPct].v || '') : '',
        rsi:     c[COL.rsi]   ? String(c[COL.rsi].v || '') : '',
        kVal:    c[COL.kVal]  ? String(c[COL.kVal].v || '') : '',
        dVal:    c[COL.dVal]  ? String(c[COL.dVal].v || '') : '',
        abnormal:c[COL.abnormal]? String(c[COL.abnormal].v || '') : '',
        op:      c[COL.op]    ? String(c[COL.op].v || '') : '',
        reasons: c[COL.reasons]? String(c[COL.reasons].v || '') : '',
      };
    }).filter(s => s.code);

    // Update summary
    const cntBuy   = allStocks.filter(s => s.op.includes('🟢')).length;
    const cntWatch = allStocks.filter(s => s.op.includes('🟡')).length;
    const cntAvoid = allStocks.filter(s => s.op.includes('🔴') || s.op.includes('⬇️')).length;
    const topScore = allStocks.length ? Math.max(...allStocks.map(s => s.score)) : 0;

    document.getElementById('cntBuy').textContent   = cntBuy;
    document.getElementById('cntWatch').textContent = cntWatch;
    document.getElementById('cntAvoid').textContent = cntAvoid;
    document.getElementById('topScore').textContent = topScore + ' 分';

    // Date tag
    const firstDate = allStocks[0]?.date;
    document.getElementById('dateTag').textContent = firstDate || '—';

    renderCards();

  } catch(e) {
    showError('載入失敗：' + e.message + '（請確認 Google Sheet 已設為公開）');
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠ ' + msg;
  box.style.display = 'block';
  document.getElementById('content').innerHTML = '';
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function renderCards() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  let filtered = allStocks.filter(s => {
    if (q && !s.name.includes(q) && !s.code.includes(q)) return false;
    if (currentFilter === 'buy')   return s.op.includes('🟢');
    if (currentFilter === 'watch') return s.op.includes('🟡');
    if (currentFilter === 'avoid') return s.op.includes('🔴');
    if (currentFilter === 'bear')  return s.op.includes('⬇️');
    return true;
  });

  if (!filtered.length) {
    document.getElementById('content').innerHTML = '<div class="state"><div style="font-size:2rem;margin-bottom:10px">📭</div><div>沒有符合條件的股票</div></div>';
    return;
  }

  const MAX_SCORE = 12;
  const html = filtered.map((s, i) => {
    const opClass = getOpClass(s.op);
    const barColor = getScoreColor(s.score, MAX_SCORE);
    const barPct = Math.min(s.score / MAX_SCORE * 100, 100);
    const netPos = s.instNet > 0;
    const reasons = parseReasons(s.reasons);

    return `<div class="card op-${opClass}" style="animation-delay:${Math.min(i*0.04,0.5)}s">
      <div class="card-top">
        <div class="stock-info">
          <div class="stock-name">${s.name}</div>
          <div class="stock-code">${s.code}</div>
        </div>
        <div class="price-block">
          <div class="price">${s.price}</div>
        </div>
      </div>

      <div class="score-row">
        <div class="score-bar-bg">
          <div class="score-bar-fill" style="width:${barPct}%;background:${barColor}"></div>
        </div>
        <div class="score-label">${s.score}/${MAX_SCORE}分</div>
      </div>

      <div class="op-badge ${opClass}">${s.op || '－'}</div>

      <div class="mini-stats">
        <div class="mini-stat">
          <div class="mini-stat-label">法人(張)</div>
          <div class="mini-stat-val ${netPos?'pos':'neg'}">${netPos?'+':''}${s.instNet}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">連買天</div>
          <div class="mini-stat-val neutral">${s.streak}天</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">五日集中</div>
          <div class="mini-stat-val neutral">${s.conc5}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">RSI</div>
          <div class="mini-stat-val neutral">${s.rsi}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">K/D</div>
          <div class="mini-stat-val neutral">${s.kVal}/${s.dVal}</div>
        </div>
        <div class="mini-stat">
          <div class="mini-stat-label">異常倍數</div>
          <div class="mini-stat-val neutral">${s.abnormal}</div>
        </div>
      </div>

      <div class="reasons">
        ${reasons.map(r => `<span class="reason-tag ${reasonClass(r)}">${r}</span>`).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `<div class="cards">${html}</div>`;
}

loadData();

// PWA install hint
const isStandalone = window.navigator.standalone;
if (!isStandalone && !localStorage.getItem('pwa-hint-dismissed')) {
  const hint = document.createElement('div');
  hint.id = 'pwa-hint';
  hint.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111318;border:1px solid #00d4aa;border-radius:14px;padding:0.9rem 1.2rem;font-size:0.78rem;color:#e8edf5;max-width:320px;width:90%;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;';
  hint.innerHTML = `
    <div style="flex:1">📲 點 Safari 底部 <strong style="color:#00d4aa">分享 □↑</strong> → <strong style="color:#00d4aa">加入主畫面</strong>，像 App 一樣使用！</div>
    <button onclick="document.getElementById('pwa-hint').remove();localStorage.setItem('pwa-hint-dismissed','1')" style="background:transparent;border:none;color:#4a5a70;font-size:1.2rem;cursor:pointer;flex-shrink:0">✕</button>
  `;
  setTimeout(() => document.body.appendChild(hint), 1500);
}

// Service Worker for offline cache
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE = 'stock-signal-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
    });
    self.addEventListener('fetch', e => {
      if (e.request.url.includes('docs.google.com')) return;
      e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
    });
  `;
  const blob = new Blob([sw], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
</body>
</html>
